name: Neon Player APK

# Builds the Android music player in apps/neon-player and publishes the debug
# APK as a downloadable artifact. Only runs when the app (or this file) changes.
on:
  push:
    paths:
      - "apps/neon-player/**"
      - ".github/workflows/neon-player-android.yml"
  pull_request:
    paths:
      - "apps/neon-player/**"
      - ".github/workflows/neon-player-android.yml"
  workflow_dispatch:

jobs:
  build:
    name: test + assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/neon-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neon-player-debug-apk
          path: apps/neon-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
